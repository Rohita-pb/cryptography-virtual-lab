<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=des/">
    <title>DES Cryptography Virtual Lab</title>
    <script>
        window.location.replace("des/");
    </script>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #fff8f5;
            color: #5c3f32;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .redirect-card {
            background: white;
            padding: 36px 42px;
            border-radius: 16px;
            border: 1px solid #eadbd5;
            box-shadow: 0 4px 18px rgba(100, 70, 55, 0.08);
            max-width: 450px;
        }
        h2 {
            margin: 0 0 12px;
            color: #8d6351;
            font-size: 24px;
        }
        p {
            margin: 8px 0;
            color: #666666;
            font-size: 15px;
        }
        a {
            display: inline-block;
            margin-top: 10px;
            background: #a47864;
            color: white;
            text-decoration: none;
            padding: 10px 22px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            transition: background 0.2s;
        }
        a:hover {
            background: #8f6654;
        }
    </style>
</head>
<body>
    <div class="redirect-card">
        <h2>DES Cryptography Virtual Lab</h2>
        <p>Loading the virtual laboratory environment...</p>
        <p><a href="des/">Enter Laboratory</a></p>
    </div>
</body>
</html>
